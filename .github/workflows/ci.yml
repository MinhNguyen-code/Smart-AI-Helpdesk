name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Backend unit and API tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Frontend tests
        run: npm run test:frontend
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable service credentials only; never repository/environment secrets.
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: smart_it_helpdesk_new_test
        # No host ports or persistent volumes: this database exists only for this job.
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Provision schema-scoped CI accounts inside the service
        shell: bash
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          docker exec -i "$MYSQL_SERVICE_ID" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql --user=root' <<'SQL'
          CREATE USER 'sih_new_test_migrate'@'127.0.0.1' IDENTIFIED BY 'ci-only-migration-password';
          CREATE USER 'sih_new_test'@'127.0.0.1' IDENTIFIED BY 'ci-only-runtime-password';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES
            ON smart_it_helpdesk_new_test.* TO 'sih_new_test_migrate'@'127.0.0.1';
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON smart_it_helpdesk_new_test.* TO 'sih_new_test'@'127.0.0.1';
          SQL
      - name: Install, verify identities, migrate, seed and run MySQL integration tests
        shell: bash
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          # Share only the service network namespace. 127.0.0.1 is the disposable
          # MySQL container, never the runner host. Preserve strict @127.0.0.1 policy.
          docker run --rm --interactive --network "container:$MYSQL_SERVICE_ID" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace \
            --env CI=true --env NODE_ENV=test \
            --env DB_TEST_HOST=127.0.0.1 --env DB_TEST_PORT=3306 \
            --env DB_TEST_NAME=smart_it_helpdesk_new_test \
            --env DB_TEST_USER=sih_new_test \
            --env DB_TEST_PASSWORD=ci-only-runtime-password \
            --env DB_TEST_MIGRATION_USER=sih_new_test_migrate \
            --env DB_TEST_MIGRATION_PASSWORD=ci-only-migration-password \
            --env SESSION_SECRET=ci-only-session-secret-at-least-32-characters \
            --env CLIENT_URL=http://localhost:5173 \
            --env UPLOAD_DIR=/tmp/helpdesk-ci-uploads \
            node:24-bookworm bash -euo pipefail -s <<'BASH'
          # Fail closed rather than reading an unexpected environment file.
          test ! -e .env
          npm ci --include=dev
          npm run db:check:test
          npm run db:migrate:test
          # The priority migration inserts P2/P4 on an empty schema. The existing
          # seed only adds P1/P3 when the entire policy table is empty. Complete
          # these reference rows here without changing production seed behavior.
          env -u DB_TEST_MIGRATION_USER -u DB_TEST_MIGRATION_PASSWORD node --input-type=module <<'JS'
          import knex from 'knex';
          import { createDatabaseConfig, validateDatabaseConfig } from './knexfile.js';
          import { assertIdentity } from './server/src/db/targetPolicy.js';
          const configuration = createDatabaseConfig('test');
          validateDatabaseConfig('test', 'runtime', configuration);
          const db = knex(configuration);
          try {
            const [rows] = await db.raw('SELECT DATABASE() AS selected_database, CURRENT_USER() AS matched_account');
            assertIdentity('test', 'runtime', rows[0]);
            await db('sla_policies').insert([
              { priority: 'P1', response_minutes: 15, resolution_minutes: 120, is_active: true },
              { priority: 'P3', response_minutes: 240, resolution_minutes: 1440, is_active: true },
            ]);
            await db.seed.run();
          } finally { await db.destroy(); }
          JS
          # Serialized files: ticket/rule fixtures temporarily edit shared SLA rows.
          # Do not opt into unrelated, uncommitted workflow or privacy fixtures.
          env -u DB_TEST_MIGRATION_USER -u DB_TEST_MIGRATION_PASSWORD npm run test:integration
          BASH
