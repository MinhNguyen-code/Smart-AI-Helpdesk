name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Backend unit and API tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Frontend tests
        run: npm run test:frontend
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
